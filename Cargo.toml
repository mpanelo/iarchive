[workspace]
resolver = "3"
members = ["crates/iarchive-cli", "crates/iarchive-core", "crates/iarchive-store", "crates/iarchive-fs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
walkdir = "2"
iarchive-core = { path = "crates/iarchive-core" }
iarchive-fs = { path = "crates/iarchive-fs" }
iarchive-store = { path = "crates/iarchive-store" }
