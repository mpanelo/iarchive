name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: python3 scripts/check_secrets.py setup --no-hook
      - run: python3 scripts/check_secrets.py check --history-only
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: stable
          arguments: --locked --all-features
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      IARCHIVE_REQUIRE_WORKER_TESTS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.3'
          python-version: '3.12'
          # Windows scripts scope uv's cache to the checkout.
          cache-local-path: ${{ runner.os == 'Windows' && format('{0}/.windows-sandbox/uv-cache', github.workspace) || '' }}
      - name: Test prerequisite detection with simulated installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/tests/prerequisites.Tests.ps1 -CheckInstalled
      - name: Test prerequisite detection in Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows/tests/prerequisites.Tests.ps1 -CheckInstalled
      - name: Set up Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/setup.ps1 -SkipPrerequisites
      - name: Run Windows checks and script smoke tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/test.ps1 -ExternalDrives 'C:'
      - name: Test replica acceptance workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/tests/replication.Tests.ps1
      - name: Test replica workflow in Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows/tests/replication.Tests.ps1
      - name: Check Windows PowerShell compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows/test.ps1 -SmokeOnly -ExternalDrives 'C:'
      - if: runner.os != 'Windows'
        run: uv sync --locked --project image-worker --group dev
      - if: runner.os != 'Windows'
        run: uv run --locked --project image-worker python scripts/check_secrets.py setup --no-hook
      - if: runner.os != 'Windows'
        run: uv run --locked --project image-worker python scripts/setup_metadata.py
      - if: runner.os != 'Windows'
        run: cargo fmt --all -- --check
      - if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: runner.os != 'Windows'
        run: cargo test --workspace --all-features --locked
      - if: runner.os != 'Windows'
        run: uv run --locked --project image-worker --group dev pytest image-worker/tests
      - if: runner.os != 'Windows'
        run: uv run --locked --project image-worker python -m unittest discover -s tests -v
      - name: Test offline cloud probe with the pinned provider
        if: runner.os != 'Windows'
        run: uv run --locked --project tools/cloud-probe --python 3.12 python -m unittest discover -s tools/cloud-probe -v
      - name: Retain synthetic Windows reports
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-script-reports
          path: |
            .smoke/windows-*/**/*.json*
            .smoke/replica-script-tests-*/**/*.json*
            .smoke/replica-script-tests-*/**/*.log
          include-hidden-files: true
