name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: stable
          arguments: --locked --all-features
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      IARCHIVE_REQUIRE_WORKER_TESTS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.3'
          python-version: '3.12'
      - run: uv sync --locked --project image-worker --group dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: uv run --locked --project image-worker --group dev pytest image-worker/tests
      - run: uv run --locked --project image-worker python -m unittest discover -s tests -v
